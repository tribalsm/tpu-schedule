<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-title" content="Расписание ТПУ">
  <title>Расписание ТПУ</title>
  <link rel="icon" type="image/x-icon" sizes="16x16" href="./favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <script>
    (() => {
      const portalUrl = 'https://ro-rasp.tpu.ru/';
      const academicYear = 2026;
      const firstSunday = Date.UTC(2026, 7, 30);
      const lastWeek = 51;
      const weekInMilliseconds = 7 * 24 * 60 * 60 * 1000;
      const tomskDate = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Tomsk',
        calendar: 'gregory',
        numberingSystem: 'latn',
        year: 'numeric',
        month: 'numeric',
        day: 'numeric',
      });

      function currentWeek() {
        const parts = Object.fromEntries(
          tomskDate.formatToParts(new Date()).map(({ type, value }) => [type, value]),
        );
        // Treat Tomsk calendar dates as UTC dates for arithmetic without local clock offsets.
        const calendarDay = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day));
        const week = 1 + Math.floor((calendarDay - firstSunday) / weekInMilliseconds);
        return week >= 1 && week <= lastWeek ? week : null;
      }

      function scheduleUrl(week) {
        return week === null ? portalUrl : `${portalUrl}gruppa_44645/${academicYear}/${week}/view.html`;
      }

      const pageUrl = new URL(location.href);
      if (!pageUrl.searchParams.has('setup')) {
        const destination = scheduleUrl(currentWeek());
        document.documentElement.hidden = true;
        location.replace(destination);
        return;
      }

      document.addEventListener('DOMContentLoaded', () => {
        const scheduleLink = document.getElementById('schedule');
        const weekLabel = document.getElementById('week');

        function updateSchedule() {
          const week = currentWeek();
          scheduleLink.href = scheduleUrl(week);
          scheduleLink.textContent = week === null ? 'Открыть портал ТПУ' : 'Открыть расписание';
          weekLabel.textContent = week === null
            ? 'Найдите группу 8К53Т на портале ТПУ.'
            : `Группа 8К53Т · Неделя ${week}`;
        }

        updateSchedule();
        scheduleLink.addEventListener('click', updateSchedule);
        // A bookmark created here opens the regular URL with automatic navigation.
        pageUrl.searchParams.delete('setup');
        history.replaceState(null, '', pageUrl);
        document.getElementById('bookmark-help').hidden = false;
      });
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      font: 100%/1.55 system-ui, sans-serif;
      --background: #f5f7f4;
      --text: #16241a;
      --muted: #4a5a50;
      --accent: #14623c;
      --button-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #142019;
        --text: #f1f7f2;
        --muted: #c3d1c7;
        --accent: #93dfb1;
        --button-text: #142019;
      }
    }
    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
    }
    main {
      width: min(100%, 26rem);
      border-block-start: 0.25rem solid var(--accent);
      padding-block-start: 1.25rem;
    }
    img { display: block; image-rendering: pixelated; }
    h1 { margin: 0.75rem 0 0.25rem; font-size: clamp(1.85rem, 6vw, 2.5rem); line-height: 1.15; }
    p { margin: 0.5rem 0 1.25rem; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .open {
      display: inline-block;
      padding: 0.65rem 1rem;
      border-radius: 0.375rem;
      background: var(--accent);
      color: var(--button-text);
      font-weight: 650;
      text-decoration: none;
    }
    .bookmark { margin: 1rem 0 0; }
  </style>
</head>
<body>
  <main>
    <img src="./favicon.ico" width="32" height="32" alt="">
    <h1>Расписание ТПУ</h1>
    <p id="week">Группа 8К53Т</p>
    <a class="open" id="schedule" href="https://ro-rasp.tpu.ru/">Открыть портал ТПУ</a>
    <p class="bookmark" id="bookmark-help" hidden>Добавьте страницу в закладки. При открытии закладки расписание откроется автоматически.</p>
  </main>
</body>
</html>
