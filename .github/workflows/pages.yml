name: Publish TPU Schedule

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install, test and build
        working-directory: pwa
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/app
          cp .nojekyll index.html schedule.js favicon.ico apple-touch-icon.png _site/
          cp -R pwa/dist/. _site/app/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
